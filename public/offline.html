<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>接続を確認してください | RockstarOS</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100dvh; margin: 0; background: #111827; color: #f9fafb; display: grid; place-items: center; }
      main { width: min(100% - 3rem, 32rem); padding: 3rem 0; }
      small { color: #cbd5e1; letter-spacing: .12em; font-weight: 700; }
      h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.2; }
      p { line-height: 1.7; color: #e2e8f0; }
      button { min-height: 48px; padding: .75rem 1.5rem; border: 2px solid transparent; border-radius: .75rem; background: #f9fafb; color: #111827; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
      button:hover { background: #dbeafe; }
    </style>
  </head>
  <body>
    <main>
      <small>ROCKSTAROS · OFFLINE</small>
      <h1>接続を確認してください</h1>
      <p>この画面はオフライン用です。仕事の状態や成果は取得できていません。接続が戻ったら再読み込みしてください。</p>
      <form action="" method="get"><button type="submit">再読み込み</button></form>
    </main>
  </body>
</html>
