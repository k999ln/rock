<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RockstarOS · In-world</title><link rel="stylesheet" href="style.css"></head><body class="nui"><main id="panel"><header><strong>● RockstarOS</strong><button id="close" hidden>閉じる</button></header><p class="eyebrow" id="mode">IN-WORLD TERMINAL · MAC FIXTURE</p><h1>ここでも、続きから。</h1><p class="hint">現実側が承認したカードが届きます。確認はゲーム内の操作記録で、現実の実行許可にはなりません。</p><section><h2>Sky Agentに仕事を頼む</h2><p class="hint">ゲームから依頼を保存し、現実側で実行・継続します。ここで選べるのはローカルToolの実行Agentです。外部LLMの推論ではありません。</p><form id="agent-request"><label for="agents">Agent</label><select id="agents"></select><p id="agent-description" class="hint"></p><label for="objective">依頼の目的</label><input id="objective" maxlength="1000" required placeholder="資料の出典を整理して"><label for="material">素材・原稿・CSV</label><textarea id="material" rows="4" maxlength="8000" required placeholder="処理したい素材を入力"></textarea><button>仕事を依頼する</button></form><div id="agent-tasks"></div></section><details><summary>カードの受信</summary><div id="cards"></div></details><form id="request"><label for="request-text">現実側への依頼</label><textarea id="request-text" rows="3" maxlength="1000" placeholder="例：この部屋の照明プランを考えたい"></textarea><button>現実側へ下書きを送る</button></form><output id="message"></output><button id="retry" hidden>同じ操作を再照会</button></main><script src="ui.js"></script></body></html>
