name: Rock star native OS source
on:
  push:
    branches: [main]
    paths: ['systems/rock-star-os/**', 'scripts/test-native.py', '.github/workflows/native-os.yml']
  pull_request:
    paths: ['systems/rock-star-os/**', 'scripts/test-native.py', '.github/workflows/native-os.yml']
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    # The launcher needs bwrap's --disable-userns (absent from Ubuntu 22.04).
    # Ubuntu 24.04 restricts unprivileged userns before bwrap can start; the
    # disposable runner relaxes that outer host control only for this job.
    # Rock's no_new_privs, bwrap namespaces/--disable-userns and seccomp stay on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Linux source-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap pkg-config libseccomp-dev libcairo2-dev libfreetype6-dev libjson-c-dev openssl e2fsprogs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify real non-root runner isolation
        working-directory: systems/rock-star-os
        run: |
          id
          /usr/bin/bwrap --version
          /usr/bin/cc -O2 -Wall -Wextra -Werror -o /tmp/rock-runner-sandbox os/runner/sandbox_launcher.c
          printf '%s' '{"text":"  hello  ","recipe":[{"op":"trim_lines"}]}' \
            | /tmp/rock-runner-sandbox "$PWD/src/blackberryrock/recipe_worker.py" "$PWD/os/runner/isolated_entry.py" \
            | grep -Fx '{"text": "hello"}'
      - name: Native source regressions (not OS boot)
        run: python3 scripts/test-native.py --output work/native-tests
      - name: Root-owned disposable UI observers, replay geometry and readiness protocol
        run: |
          mkdir -p work/native-root-ui
          sudo "$(command -v python3)" -B -W error::ResourceWarning -m unittest discover -s systems/rock-star-os/os/ui -p 'test_*evidence.py' -v > work/native-root-ui/observers.log 2>&1
          cat work/native-root-ui/observers.log
          if grep -E 'ResourceWarning:|Exception ignored|\.\.\. skipped' work/native-root-ui/observers.log; then exit 1; fi
          cp -R systems/rock-star-os/os/ui work/native-root-ui/ui
          make -C work/native-root-ui/ui rock-ui-health-test rock-ui-test
          sudo work/native-root-ui/ui/rock-ui-health-test > work/native-root-ui/health.log 2>&1
          cat work/native-root-ui/health.log
          sudo "$(command -v python3)" -B -W error::ResourceWarning systems/rock-star-os/os/ui/test_wallet_replay.py \
            --renderer work/native-root-ui/ui/rock-ui-test \
            --font systems/rock-star-os/os/assets/NotoSansCJKjp-Regular.otf > work/native-root-ui/wallet-replay.log 2>&1
          cat work/native-root-ui/wallet-replay.log
          if grep -E 'ResourceWarning:|Exception ignored|\.\.\. skipped' work/native-root-ui/wallet-replay.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-test-results
          path: |
            work/native-tests/
            work/native-root-ui/*.log
          retention-days: 7
