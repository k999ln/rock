name: Rock star native OS source
on:
  push:
    branches: [main]
    paths: ['systems/rock-star-os/**', 'scripts/test-native.py', '.github/workflows/native-os.yml']
  pull_request:
    paths: ['systems/rock-star-os/**', 'scripts/test-native.py', '.github/workflows/native-os.yml']
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    # The launcher sets no_new_privs before execing bwrap. Ubuntu 24.04's
    # AppArmor userns grant therefore cannot be acquired after launch.
    # 22.04 runs the same real non-root bwrap + seccomp isolation without
    # weakening the launcher or disabling the host-wide AppArmor control.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Linux source-test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bubblewrap pkg-config libseccomp-dev libcairo2-dev libfreetype6-dev libjson-c-dev openssl e2fsprogs
      - name: Verify real non-root runner isolation
        working-directory: systems/rock-star-os
        run: |
          id
          /usr/bin/bwrap --version
          /usr/bin/cc -O2 -Wall -Wextra -Werror -o /tmp/rock-runner-sandbox os/runner/sandbox_launcher.c
          printf '%s' '{"text":"  hello  ","recipe":[{"op":"trim_lines"}]}' \
            | /tmp/rock-runner-sandbox "$PWD/src/blackberryrock/recipe_worker.py" "$PWD/os/runner/isolated_entry.py" \
            | grep -Fx '{"text": "hello"}'
      - name: Native source regressions (not OS boot)
        run: python3 scripts/test-native.py --output work/native-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-test-results
          path: work/native-tests/
          retention-days: 7
