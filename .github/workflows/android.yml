name: Rock star Android prototype
on:
  push:
    branches: [main]
    paths: ['android/**', 'contracts/**', 'os/**', 'scripts/check-os-*.mjs', 'scripts/package-android-trial.py', 'scripts/stage-operator-agent-overlay.py', 'scripts/freeze-phone-build-inputs.py', 'scripts/jev-pixel-relay.mjs', 'tests/jev-pixel-relay.test.mjs', 'tests/android-jev-preview-boundary.test.mjs', 'tests/test_stage_operator_agent_overlay.py', 'tests/test_freeze_phone_build_inputs.py', 'docs/android-trial.md', 'docs/workstreams/07-android-device-local-ai.md', '.github/workflows/android.yml', 'lib/mr-tools.ts', 'lib/decision/**']
  pull_request:
    paths: ['android/**', 'contracts/**', 'os/**', 'scripts/check-os-*.mjs', 'scripts/package-android-trial.py', 'scripts/stage-operator-agent-overlay.py', 'scripts/freeze-phone-build-inputs.py', 'scripts/jev-pixel-relay.mjs', 'tests/jev-pixel-relay.test.mjs', 'tests/android-jev-preview-boundary.test.mjs', 'tests/test_stage_operator_agent_overlay.py', 'tests/test_freeze_phone_build_inputs.py', 'docs/android-trial.md', 'docs/workstreams/07-android-device-local-ai.md', '.github/workflows/android.yml', 'lib/mr-tools.ts', 'lib/decision/**']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test fixed Jev relay and Android debug network boundary
        run: node --experimental-strip-types --test tests/jev-pixel-relay.test.mjs tests/android-jev-preview-boundary.test.mjs
      - name: Compile Android packages and test shared SQLite core
        run: gradle -p android :core:test :tool-sdk:testDebugUnitTest :shell-api:assembleDebug :automation:assembleDebug :shell:assembleDebug :article-tool:assembleDebug :operator-agent:assembleDebug :jev-preview:assembleDebug :jev-preview:assembleRelease :jev-preview:testDebugUnitTest :article-tool:lintDebug :operator-agent:lintDebug :automation:lintDebug :shell:lintDebug :jev-preview:lintDebug :jev-preview:lintRelease --no-daemon
      - name: Upload Jev Pixel preview debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-pixel-preview-debug-${{ github.run_id }}
          path: android/jev-preview/build/outputs/apk/debug/jev-preview-debug.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Compare Java tools with existing business behavior
        run: node --experimental-strip-types scripts/check-os-parity.mjs
      - name: Check source and contract consistency (not OS boot)
        run: |
          node scripts/check-os-contracts.mjs
          python3 -m unittest tests.test_stage_operator_agent_overlay -v
          python3 -m unittest tests.test_freeze_phone_build_inputs -v
      - name: Permit KVM in the ephemeral test runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise real Binder and SQLite in a disposable Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/article-tool/build/outputs/apk/debug/article-tool-debug.apk
            adb install -r android/automation/build/outputs/apk/debug/automation-debug.apk
            gradle -p android :shell:connectedDebugAndroidTest --no-daemon
            # Local-AI instrumentation needs its separately built, same-test-signed APK.
            # This workflow keeps the Broker/SQLite/Tool suite deterministic; Local AI
            # has its own pinned-source workflow and separately recorded device run.
            gradle -p android :automation:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.notClass=dev.rock.automation.LocalAiServiceIntegrationTest \
              --no-daemon
            gradle -p android :operator-agent:connectedDebugAndroidTest --no-daemon
      - name: Verify and collect the successful Android P1 trial set
        env:
          ROCK_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/package-android-trial.py --output work/android-p1-trial
      - uses: actions/upload-artifact@v4
        with:
          name: android-p1-trial-${{ github.run_id }}
          path: work/android-p1-trial/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-prototype-reports
          path: |
            android/core/build/test-results/test/
            android/tool-sdk/build/test-results/testDebugUnitTest/
            android/automation/build/reports/
            android/automation/build/outputs/androidTest-results/
            android/shell/build/reports/
            android/shell/build/outputs/androidTest-results/
            android/article-tool/build/reports/
            android/jev-preview/build/reports/
            android/operator-agent/build/reports/
            android/operator-agent/build/outputs/androidTest-results/
          retention-days: 7
      # Only successful P1 debug trial artifacts; no release keys, OS deployment or device flashing.
