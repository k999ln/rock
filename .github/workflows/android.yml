name: Rock star Android prototype
on:
  push:
    branches: [main]
    paths: ['android/**', 'contracts/**', 'os/**', 'scripts/check-os-*.mjs', 'scripts/package-android-trial.py', 'docs/android-trial.md', '.github/workflows/android.yml', 'lib/mr-tools.ts']
  pull_request:
    paths: ['android/**', 'contracts/**', 'os/**', 'scripts/check-os-*.mjs', 'scripts/package-android-trial.py', 'docs/android-trial.md', '.github/workflows/android.yml', 'lib/mr-tools.ts']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android packages and test shared SQLite core
        run: gradle -p android :core:test :tool-sdk:testDebugUnitTest :automation:assembleDebug :article-tool:assembleDebug :automation:lintDebug :article-tool:lintDebug --no-daemon
      - name: Compare Java tools with existing business behavior
        run: node --experimental-strip-types scripts/check-os-parity.mjs
      - name: Check source and contract consistency (not OS boot)
        run: node scripts/check-os-contracts.mjs
      - name: Permit KVM in the ephemeral test runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise real Binder and SQLite in a disposable Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/article-tool/build/outputs/apk/debug/article-tool-debug.apk
            gradle -p android :automation:connectedDebugAndroidTest --no-daemon
      - name: Verify and collect the successful Android P1 trial pair
        env:
          ROCK_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/package-android-trial.py --output work/android-p1-trial
      - uses: actions/upload-artifact@v4
        with:
          name: android-p1-trial-${{ github.run_id }}
          path: work/android-p1-trial/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-prototype-reports
          path: |
            android/core/build/test-results/test/
            android/tool-sdk/build/test-results/testDebugUnitTest/
            android/automation/build/reports/
            android/automation/build/outputs/androidTest-results/
            android/article-tool/build/reports/
          retention-days: 7
      # Only successful P1 debug trial artifacts; no release keys, OS deployment or device flashing.
