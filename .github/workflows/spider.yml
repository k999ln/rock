name: SPIDER repository security

on:
  push:
    branches: [main, codex/spider-guard]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: spider-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: SPIDER / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read candidate history as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read pinned scanner and reviewed policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: k999ln/rock
          ref: b4c9000e2f265723d29b90c5f37c7f34b1a18362
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/spider-repository-scan.py
            /tests/test_spider_repository_scan.py
            /tests/test_spider_gitleaks_policy.py
            /tests/sky-commerce.test.mjs
            /systems/rock-star-os/os/registry/fixtures/PUBLIC-FIXTURE-KEY.pem
            /.github/spider/
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spider-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            -o "$RUNNER_TEMP/spider-bin/gitleaks.tar.gz"
          cd "$RUNNER_TEMP/spider-bin"
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Check scanner failure and privacy boundaries
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/spider-bin/gitleaks
        run: python3 -B -m unittest discover -s control/tests -p test_spider_repository_scan.py
      - name: Verify exact public-fixture exceptions
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/spider-bin/gitleaks
        run: python3 -B -m unittest discover -s control/tests -p test_spider_gitleaks_policy.py
      - name: Inspect reachable Git history
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 control/scripts/spider-repository-scan.py
          --repository candidate
          --gitleaks "$RUNNER_TEMP/spider-bin/gitleaks"
          --config control/.github/spider/gitleaks.toml
          --output "$RUNNER_TEMP/spider-report"
      - name: Save metadata-only report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spider-security-report-${{ github.run_id }}
          path: ${{ runner.temp }}/spider-report/report.json
          if-no-files-found: ignore
          retention-days: 7
