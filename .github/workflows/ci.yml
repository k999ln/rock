name: Rock star verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned historical Game negative-control fixture
        timeout-minutes: 2
        run: |
          git fetch --no-tags --depth=1 origin ee9b88010c4ccb20be1db46177e3805380995c4b
          python3 - <<'PYBASE'
          import hashlib, subprocess
          baseline = subprocess.check_output(['git', 'show', 'ee9b88010c4ccb20be1db46177e3805380995c4b:components/workbench.tsx'])
          if hashlib.sha256(baseline).hexdigest() != 'd93e120c16b86f136cada419a500a4b192e71319fafc597024bab701f6b7f6c2':
              raise SystemExit('Pinned Game Workbench baseline SHA256 mismatch')
          PYBASE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Offline alias validation uses SQLite authorizer/serialization APIs.
          node-version: '26.12.1'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sites/avocado-mini
      - name: Verify bounded Pixel worker diagnostics and Linux parent lifetime
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/test_pixel_worker_diagnostics.py -v
          python3 tests/test_pixel_worker_parent_exit.py -v
      - name: Test Pixel cache/update safety (synthetic)
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/test_pixel_cached_prepare.py -v
          python3 tests/test_pixel_guest_update.py -v
      - run: npm run verify
      - name: Verify synthetic game wire vectors with Node crypto
        run: node systems/rock-star-os/tests/verify_game_connection_vectors.mjs
