# Root reviews the exact control commit and evidence Draft before pushing.
name: rc2 D4 independent Linux frozen candidate
on:
  push:
    branches: [codex/rockstaros-launch-candidate-20260910]
    paths: ['.github/workflows/final-d4-candidate.yml', 'scripts/ci-d4/**']
permissions: {}
concurrency:
  group: rc2-d4-387142563
  cancel-in-progress: false
jobs:
  d4:
    if: github.repository == 'k999ln/rock' && github.ref == 'refs/heads/codex/rockstaros-launch-candidate-20260910' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Official library/debian 13-slim amd64 digest resolved from registry-1.docker.io.
    container: debian@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f
    permissions:
      contents: write # GET candidate386933271; POST only separate Draft387142563.
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare disposable host tools and a separate verifier identity
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pil qemu-system-arm qemu-utils e2fsprogs openssl tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn ca-certificates passwd util-linux tar gzip coreutils
          useradd --uid 20000 --create-home d4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5
        with:
          ref: b7d819cd291b653d165aa124f25a52b9898bfb2e
          path: frozen-source
          persist-credentials: false
      - name: Transport and admission fixture checks
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/control/scripts/ci-d4"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_ci_admission.py test_ci_transport.py
      - name: Fetch exactly the eight pinned rc2 candidate assets
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B "$GITHUB_WORKSPACE/control/scripts/ci-d4/run-final-d4-ci.py" fetch
      - name: Verify both manifests, all frozen source and fresh immutable copies
        timeout-minutes: 25
        run: |
          runuser -u d4 -- env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/d4 LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" python3 -B "$GITHUB_WORKSPACE/control/scripts/ci-d4/run-final-d4-ci.py" prepare --source "$GITHUB_WORKSPACE/frozen-source"
      - name: Execute the original D4 matrix once, with its native limits unchanged
        timeout-minutes: 228
        run: |
          runuser -u d4 -- env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/d4 LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python3 -B "$GITHUB_WORKSPACE/control/scripts/ci-d4/run-final-d4-ci.py" run --source "$GITHUB_WORKSPACE/frozen-source"
      - name: Preserve all completed or partial raw files as bounded archive chunks
        if: always()
        timeout-minutes: 25
        run: python3 -B "$GITHUB_WORKSPACE/control/scripts/ci-d4/run-final-d4-ci.py" archive
      - name: Upload only to the separate private evidence Draft and read every byte back
        if: always()
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B "$GITHUB_WORKSPACE/control/scripts/ci-d4/run-final-d4-ci.py" upload
