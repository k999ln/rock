<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">avokadoの製品構成</title>
  <desc id="description">avocadoMini R5からRockstarOS v1.0を通じ、SkyとZemaでToolを探し仕事を進める設計上の関係を示す。実装完了を示す図ではない。</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#10171b"/>
      <stop offset="1" stop-color="#17232a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop stop-color="#8d9ba0"/>
      <stop offset="0.28" stop-color="#f1f5f3"/>
      <stop offset="0.7" stop-color="#b6c3c5"/>
      <stop offset="1" stop-color="#7f8d92"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#bde97c"/>
      <stop offset="1" stop-color="#72d6d6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#334148" stroke-width="2"/>
  <rect x="42" y="42" width="54" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="110" y="51" fill="#bde97c" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="4">AVOKADO / SYSTEM MAP</text>
  <text x="42" y="99" fill="#f3f6f2" font-family="Arial, Noto Sans JP, sans-serif" font-size="31" font-weight="700">遊ぶ、つくる、暮らす。その下にある設計。</text>

  <g fill="#1d2a30" stroke="#40535b" stroke-width="2">
    <rect x="42" y="132" width="344" height="205" rx="20"/>
    <rect x="428" y="132" width="344" height="205" rx="20"/>
    <rect x="814" y="132" width="344" height="205" rx="20"/>
  </g>

  <!-- The device icon follows the R5 envelope: one slim mini, a black camera band and a low round base. -->
  <g transform="translate(74 168)">
    <ellipse cx="65" cy="139" rx="61" ry="13" fill="#74858a"/>
    <path d="M4 139v10c0 8 27 15 61 15s61-7 61-15v-10" fill="url(#metal)" stroke="#a2afb2"/>
    <rect x="47" y="4" width="36" height="137" rx="8" fill="url(#metal)" stroke="#cad4d5"/>
    <rect x="47" y="25" width="36" height="31" fill="#111a20"/>
    <circle cx="57" cy="40" r="5" fill="#263f4a" stroke="#7bd8db"/>
    <circle cx="72" cy="40" r="5" fill="#263f4a" stroke="#7bd8db"/>
  </g>
  <text x="229" y="176" fill="#bde97c" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">01 / HARDWARE</text>
  <text x="229" y="217" fill="#f3f6f2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">avocadoMini</text>
  <text x="229" y="249" fill="#bed0d2" font-family="Arial, Noto Sans JP, sans-serif" font-size="18">R5 · 1本から</text>
  <text x="229" y="282" fill="#94a8ac" font-family="Arial, Noto Sans JP, sans-serif" font-size="15">入力 / 遊び / 保存</text>

  <g transform="translate(459 175)" fill="none" stroke-width="3">
    <circle cx="65" cy="65" r="55" stroke="#43636b"/>
    <circle cx="65" cy="65" r="39" stroke="#73ced0"/>
    <circle cx="65" cy="65" r="22" stroke="#bde97c"/>
    <circle cx="65" cy="65" r="5" fill="#e9f6d7" stroke="none"/>
  </g>
  <text x="612" y="176" fill="#81d9d8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">02 / FOUNDATION</text>
  <text x="612" y="217" fill="#f3f6f2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">RockstarOS</text>
  <text x="612" y="249" fill="#bed0d2" font-family="Arial, Noto Sans JP, sans-serif" font-size="18">v1.0 · 共通基盤</text>
  <text x="612" y="282" fill="#94a8ac" font-family="Arial, Noto Sans JP, sans-serif" font-size="15">権限 / 仕事 / 記録</text>

  <g transform="translate(846 176)" fill="none" stroke="#80d7d6" stroke-width="3">
    <path d="M18 36h77M56 36v71M18 36l38 71 39-71"/>
    <circle cx="18" cy="36" r="9" fill="#1d2a30"/>
    <circle cx="95" cy="36" r="9" fill="#1d2a30"/>
    <circle cx="56" cy="107" r="9" fill="#1d2a30"/>
  </g>
  <text x="998" y="176" fill="#bde97c" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">03 / EXPERIENCE</text>
  <text x="998" y="217" fill="#f3f6f2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Sky / Zema</text>
  <text x="998" y="249" fill="#bed0d2" font-family="Arial, Noto Sans JP, sans-serif" font-size="18">ToolとAIチーム</text>
  <text x="998" y="282" fill="#94a8ac" font-family="Arial, Noto Sans JP, sans-serif" font-size="15">探す / 頼む / 続ける</text>

  <path d="M390 235h31m-10-9 10 9-10 9M776 235h31m-10-9 10 9-10 9" fill="none" stroke="#a7c9bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 372h1116" stroke="#40535b"/>
  <text x="42" y="399" fill="#a5b7b8" font-family="Arial, Noto Sans JP, sans-serif" font-size="15">設計上の関係を示す図。端末の実機動作やOS統合の完了を示すものではありません。</text>
</svg>
