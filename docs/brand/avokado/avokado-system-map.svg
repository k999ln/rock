<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">avokado product system</title>
  <desc id="desc">The R5 device, RockstarOS foundation, and Sky and Zema experience form three layers of the current design.</desc>
  <rect width="1200" height="350" rx="18" fill="#f6f4f0"/>
  <rect x="1" y="1" width="1198" height="348" rx="17" fill="none" stroke="#dcd8d2" stroke-width="2"/>
