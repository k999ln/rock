    <text x="48" y="62" font-size="17" font-weight="700" letter-spacing="5">THE SYSTEM</text>
    <text x="1152" y="61" text-anchor="end" font-size="13" letter-spacing="2" fill="#747773">AVOKADO / R5</text>
    <line x1="48" y1="82" x2="1152" y2="82" stroke="#c9c9c2" stroke-width="1"/>
