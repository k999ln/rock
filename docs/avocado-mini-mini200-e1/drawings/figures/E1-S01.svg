<text x="1198" y="260" font-size="23">身体を使わず設定も可能</text>
<text x="1198" y="293" font-size="23">AV delayは実測して補正</text>
<path d="M1120,260 L1170,260" stroke="#314354" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="1180" y="460" width="365" height="275" rx="10" fill="#f4f7f9" stroke="#314354" stroke-width="2"/>
