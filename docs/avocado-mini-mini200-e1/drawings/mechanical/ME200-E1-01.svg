<text x="85" y="789" font-size="20" text-anchor="start" style="fill:#193449">前面3丸窓Ø54は外観REF。左/右tracking候補 + 中央RGB、左右baseline120。</text>
<text x="85" y="825" font-size="20" text-anchor="start" style="fill:#193449">小型cameraの搭載枠へ変更。旧GS + Theia 3本を収納済みとはしない。</text>
<text x="85" y="861" font-size="20" text-anchor="start" style="fill:#193449">本体は伸縮しない。足・操作部・遮光部は通常使用中も外形内へ収める。</text>
<text x="85" y="917" font-size="18" text-anchor="start" style="fill:#a34e37">XVF3800候補のmic間隔66を参照。導音孔・ガスケット・配線・防振の加工寸法は未確定。</text>
<text x="85" y="949" font-size="18" text-anchor="start" style="fill:#a34e37">外部支持・AC電源・差込プラグ/ケーブル曲げ空間は198 x178 x198の範囲外。</text>
