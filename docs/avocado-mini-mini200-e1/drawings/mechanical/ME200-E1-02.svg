<text x="766" y="556" font-size="19" text-anchor="start" style="fill:#193449">上部隔壁 z172.5-174 / 低振動保持・封止配線HOLD。</text>
<text x="766" y="590" font-size="19" text-anchor="start" style="fill:#193449">音声部も放熱が必要。密閉して熱を閉じ込めない。</text>
<text x="766" y="624" font-size="19" text-anchor="start" style="fill:#193449">物理muteの遮断と残音対策は回路・実機で検証。</text>
<text x="760" y="706" font-size="20" text-anchor="start" style="fill:#193449">80W DC / η90% → 箱内発熱88.89Wの仮枠。</text>
<text x="760" y="741" font-size="20" text-anchor="start" style="fill:#193449">吸気自由45cm² x2 / 排気67.2cm²（開口50%仮）。</text>
<text x="760" y="776" font-size="20" text-anchor="start" style="fill:#193449">ΔT10K: 26.53m³/h / 係数2の検討点53.07m³/h。</text>
<text x="760" y="811" font-size="20" text-anchor="start" style="fill:#193449">圧損・fan騒音・温度・音声認識は未測定。</text>
