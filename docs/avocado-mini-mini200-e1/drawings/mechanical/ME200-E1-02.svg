<text x="760" y="224" font-size="19" text-anchor="start" style="fill:#193449">1  計算機・RAM・SSD: 170 x118 x35</text>
<text x="760" y="258" font-size="19" text-anchor="start" style="fill:#193449">2  放熱器/duct: 170 x116 x46</text>
<text x="760" y="292" font-size="19" text-anchor="start" style="fill:#193449">3  後方fan/plenum: 170 x36 x90</text>
<text x="760" y="326" font-size="19" text-anchor="start" style="fill:#193449">4  前3眼・支持: 180 x46 x64</text>
<text x="760" y="360" font-size="19" text-anchor="start" style="fill:#193449">5  OAK制御板: 170 x110 x35（独立区画）</text>
<text x="760" y="394" font-size="19" text-anchor="start" style="fill:#193449">6  DC保護: 56 x60 x22 / 7  後部I/O: 170 x34 x21</text>
