<g fill="#b9a8ef" font-size="13" letter-spacing="3"><text x="102" y="324">01 / CONVERSATION</text><text x="444" y="324">02 / APPROVAL</text><text x="786" y="324">03 / WORK</text><text x="1128" y="324">04 / RESULTS</text></g>
<g fill="#f1eef9" font-size="29" font-weight="600"><text x="102" y="379">Ask &amp; clarify</text><text x="444" y="379">Review &amp; decide</text><text x="786" y="379">Track &amp; control</text><text x="1128" y="379">Save &amp; continue</text></g>
