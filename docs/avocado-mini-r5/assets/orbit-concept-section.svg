  <text x="99" y="392" fill="#536173" font-family="Arial, sans-serif" font-size="15">H1二択カードの概念</text>
  <text x="99" y="416" fill="#536173" font-family="Arial, sans-serif" font-size="15">視域・照度・誤タップを測る</text>

  <rect x="868" y="184" width="258" height="86" rx="11" fill="#e7f1f1" stroke="#688b90" stroke-width="2"/>
  <text x="997" y="216" text-anchor="middle" fill="#194d53" font-family="Arial, sans-serif" font-size="18" font-weight="700">衛星WAN</text>
  <text x="997" y="243" text-anchor="middle" fill="#31565c" font-family="Arial, sans-serif" font-size="15">上り＋下り＋IPを同一機で</text>
  <line x1="657" y1="213" x2="866" y2="213" stroke="#4c8588" stroke-width="3"/>
  <polygon points="858,207 870,213 858,219" fill="#4c8588"/>
  <rect x="868" y="344" width="258" height="86" rx="11" fill="#eef0f5" stroke="#788a9e" stroke-width="2"/>
  <text x="997" y="376" text-anchor="middle" fill="#263e5e" font-family="Arial, sans-serif" font-size="18" font-weight="700">Wi-Fi共有</text>
