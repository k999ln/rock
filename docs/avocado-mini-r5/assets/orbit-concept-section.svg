  <line x1="837" y1="446" x2="837" y2="387" stroke="#6e8399" stroke-width="3"/>
  <line x1="837" y1="387" x2="866" y2="387" stroke="#6e8399" stroke-width="3"/>
  <polygon points="858,381 870,387 858,393" fill="#6e8399"/>
  <rect x="868" y="506" width="258" height="95" rx="11" fill="#f3f2ed" stroke="#9a9477" stroke-width="2"/>
  <text x="997" y="541" text-anchor="middle" fill="#635b31" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sky / Zema / Game</text>
  <text x="997" y="568" text-anchor="middle" fill="#6d674f" font-family="Arial, sans-serif" font-size="15">仕事・承認・成果を継続</text>
  <line x1="656" y1="451" x2="812" y2="451" stroke="#8a8569" stroke-width="3"/>
  <line x1="812" y1="451" x2="812" y2="554" stroke="#8a8569" stroke-width="3"/>
  <line x1="812" y1="554" x2="866" y2="554" stroke="#8a8569" stroke-width="3"/>
  <polygon points="858,548 870,554 858,560" fill="#8a8569"/>
  <text x="48" y="687" fill="#596878" font-family="Arial, sans-serif" font-size="15">MAT15 / OI01–06 未実施。既存9770 moduleは図の区画に収まらず、光学経路・体積・製造図ではありません。</text>
</svg>
