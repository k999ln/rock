  <text x="565" y="231" text-anchor="middle" fill="#184c53" font-family="Arial, sans-serif" font-size="13">衛星・地上antenna</text>
  <rect x="485" y="261" width="160" height="75" rx="8" fill="#dce4fa" stroke="#6179b3" stroke-width="2"/>
  <text x="565" y="290" text-anchor="middle" fill="#274983" font-family="Arial, sans-serif" font-size="16" font-weight="700">光学カセット</text>
  <text x="565" y="314" text-anchor="middle" fill="#274983" font-family="Arial, sans-serif" font-size="13">折返し空中結像候補</text>
  <rect x="473" y="348" width="184" height="54" rx="10" fill="#263440"/>
  <text x="565" y="381" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">手・距離・周囲光sensor</text>
  <rect x="485" y="413" width="160" height="69" rx="8" fill="#ecf0f1" stroke="#6f7c85" stroke-width="2"/>
  <text x="565" y="441" text-anchor="middle" fill="#253745" font-family="Arial, sans-serif" font-size="15" font-weight="700">RockstarOS</text>
  <text x="565" y="463" text-anchor="middle" fill="#253745" font-family="Arial, sans-serif" font-size="13">本人鍵・job・Wi-Fi AP</text>
  <rect x="485" y="494" width="160" height="60" rx="8" fill="#e8eed7" stroke="#71884f" stroke-width="2"/>
  <text x="565" y="523" text-anchor="middle" fill="#3f5827" font-family="Arial, sans-serif" font-size="16" font-weight="700">携帯電池</text>
  <text x="565" y="544" text-anchor="middle" fill="#3f5827" font-family="Arial, sans-serif" font-size="13">保護・温度監視</text>
  <rect x="445" y="570" width="240" height="31" rx="8" fill="#adb8bf" stroke="#5b6874" stroke-width="2"/>
  <text x="565" y="591" text-anchor="middle" fill="#243445" font-family="Arial, sans-serif" font-size="13">前縁crown候補・dock接点</text>
  <rect x="398" y="610" width="334" height="41" rx="7" fill="#c7d0d7" stroke="#647583" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="565" y="637" text-anchor="middle" fill="#263440" font-family="Arial, sans-serif" font-size="16">住まいに残る固定dock（演算なし）</text>
