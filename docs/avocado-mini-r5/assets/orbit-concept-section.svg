<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">avocadoMini Orbitの概念断面と通信・空間操作</title>
  <desc id="desc">本体上部にRF窓、光学カセット、中央にセンサーと演算、下部に電池を置き、ドックと空中カード、衛星とWi-Fi共有の関係を示す概念図。寸法は比較目標で実機図ではない。</desc>
  <rect width="1200" height="720" fill="#f7f8fa"/>
  <text x="48" y="58" fill="#15243b" font-family="Arial, sans-serif" font-size="28" font-weight="700">avocadoMini Orbit — ひとつの本体で、空間・仕事・通信を持ち出す</text>
  <text x="48" y="91" fill="#526173" font-family="Arial, sans-serif" font-size="17">概念断面 / 実部品の収納、光路、熱、無線、安全は未受入</text>

  <rect x="470" y="164" width="190" height="420" rx="60" fill="#d7dde2" stroke="#5b6874" stroke-width="3"/>
  <rect x="482" y="178" width="166" height="72" rx="26" fill="#dbe9e9" stroke="#557c81" stroke-width="2"/>
