<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" role="img" aria-labelledby="title desc">
  <title id="title">空中二択カードとToF視野の幾何比較</title>
  <desc id="desc">幅130ミリの空中カードを75ミリ離れた中央センサーで読む場合、水平45度の視野は62ミリ、水平60度の視野は87ミリ。60度でも全幅には約113ミリの距離が必要という仮の幾何。実際の指追跡精度を表さない。</desc>
  <rect width="1180" height="690" fill="#f7f9fb"/>
  <text x="44" y="54" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18364a">空中二択を読むには、視野と指位置の両方が要る</text>
  <text x="44" y="85" font-family="Arial, sans-serif" font-size="16" fill="#536c7c">中央配置の単純な平面幾何。Sensor FoVは仕様値、像面と指の精度は未測定。</text>
  <rect x="460" y="122" width="24" height="416" fill="#e7eef4" stroke="#7892a3" stroke-width="2"/>
  <text x="408" y="110" font-family="Arial, sans-serif" font-size="16" fill="#476276">像面 75 mm</text>
  <rect x="460" y="70" width="20" height="520" fill="none" stroke="#b47546" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="500" y="78" font-family="Arial, sans-serif" font-size="16" fill="#98623d">二択カード 130 mm</text>
  <circle cx="470" cy="210" r="100" fill="#deefe7" stroke="#4e9a7a" stroke-width="3"/>
  <circle cx="470" cy="450" r="100" fill="#deefe7" stroke="#4e9a7a" stroke-width="3"/>
  <text x="443" y="214" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#326e55">応答</text>
  <text x="443" y="454" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#326e55">拒否</text>
  <circle cx="160" cy="330" r="12" fill="#17384e"/>
  <text x="82" y="360" font-family="Arial, sans-serif" font-size="16" fill="#17384e">中央sensor</text>
  <path d="M160 330 L460 206 L460 454 Z" fill="#5b9bc4" fill-opacity="0.16" stroke="#417da8" stroke-width="2"/>
  <path d="M160 330 L460 157 L460 503 Z" fill="#62a888" fill-opacity="0.13" stroke="#46936f" stroke-width="2"/>
  <line x1="460" y1="206" x2="460" y2="454" stroke="#417da8" stroke-width="6"/>
  <line x1="480" y1="157" x2="480" y2="503" stroke="#46936f" stroke-width="6"/>
  <line x1="160" y1="600" x2="460" y2="600" stroke="#60798b" stroke-width="2"/>
  <text x="259" y="625" font-family="Arial, sans-serif" font-size="17" fill="#465f72">75 mm</text>
  <text x="740" y="134" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#213f55">幾何上の届く幅</text>
  <rect x="740" y="166" width="22" height="22" fill="#5b9bc4" fill-opacity="0.35" stroke="#417da8"/>
  <text x="775" y="183" font-family="Arial, sans-serif" font-size="18" fill="#315774">L8CX・水平45°：約62 mm</text>
  <rect x="740" y="214" width="22" height="22" fill="#62a888" fill-opacity="0.35" stroke="#46936f"/>
  <text x="775" y="231" font-family="Arial, sans-serif" font-size="18" fill="#316d54">L7CX・水平60°：約87 mm</text>
  <rect x="740" y="262" width="22" height="22" fill="none" stroke="#b47546" stroke-width="3"/>
  <text x="775" y="279" font-family="Arial, sans-serif" font-size="18" fill="#86593a">必要な二択余白込み：130 mm</text>
  <text x="740" y="335" font-family="Arial, sans-serif" font-size="17" fill="#38556a">L7CX一個で全幅を覆う単純距離：</text>
  <text x="740" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#275d45">130 ÷ (2 tan 30°) ≈ 113 mm</text>
  <text x="740" y="416" font-family="Arial, sans-serif" font-size="17" fill="#38556a">100 mmでも約115 mm。後退配置すると</text>
  <text x="740" y="443" font-family="Arial, sans-serif" font-size="17" fill="#38556a">capと襟による遮蔽を別に測る。</text>
  <text x="740" y="491" font-family="Arial, sans-serif" font-size="17" fill="#38556a">FoVが足りても8×8 zoneだけで</text>
  <text x="740" y="518" font-family="Arial, sans-serif" font-size="17" fill="#38556a">指先の確定精度は証明されない。</text>
  <line x1="44" y1="650" x2="1136" y2="650" stroke="#cfdae2" stroke-width="2"/>
  <text x="44" y="675" font-family="Arial, sans-serif" font-size="15" fill="#5b6e7b">資料：ST VL53L8CX DS14161 / VL53L7CX DS13865。図は製品性能・光学像の存在・光安全の証拠ではない。</text>
</svg>
