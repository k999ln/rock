<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
  <title id="title">L構成の面一収納と50mmせり出し時の200mm全高衝突</title>
  <desc id="desc">186mmの本体を全長収納するスリーブから50mmせり出すと、組立の軸方向包絡は最小236mm。200mm上限を36mm超える机上の寸法鎖。</desc>
  <rect width="960" height="750" fill="#0c1724"/>
  <text x="42" y="54" fill="#f7f7f1" font-family="sans-serif" font-size="27" font-weight="700">全長収納 + 50mm lift は、組立全高 236mm 以上</text>
  <text x="42" y="82" fill="#9fb5c7" font-family="sans-serif" font-size="16">L構成の寸法仮説を同一尺度で比較。固定sleeveの底厚、接点、latch、公差は未計上。</text>
  <g transform="translate(0 110)">
  <line x1="42" x2="918" y1="530" y2="530" stroke="#546d81" stroke-width="2"/>
  <text x="42" y="559" fill="#9fb5c7" font-family="sans-serif" font-size="15">共通の最下端</text>

  <g font-family="sans-serif">
    <text x="126" y="123" fill="#f7f7f1" font-size="20" font-weight="700">Stow</text>
    <text x="116" y="148" fill="#9fb5c7" font-size="15">上端が面一</text>
    <rect x="110" y="158" width="122" height="372" rx="12" fill="#b9c2cb" stroke="#eef0f0" stroke-width="3"/>
    <rect x="110" y="158" width="122" height="41" rx="11" fill="#1b2631"/>
    <rect x="92" y="158" width="18" height="372" fill="#527c8a" opacity="0.8"/>
    <rect x="232" y="158" width="18" height="372" fill="#527c8a" opacity="0.8"/>
    <line x1="68" x2="270" y1="158" y2="158" stroke="#e4d8aa" stroke-width="4"/>
    <text x="258" y="188" fill="#e4d8aa" font-size="15">家具表面</text>
    <text x="124" y="337" fill="#182638" font-size="17" font-weight="700">core 186mm</text>

    <text x="421" y="-10" fill="#f7f7f1" font-size="20" font-weight="700">Ready / L-A</text>
    <text x="416" y="15" fill="#9fb5c7" font-size="15">同じcoreを50mm上昇</text>
    <rect x="415" y="158" width="18" height="372" fill="#527c8a" opacity="0.8"/>
    <rect x="555" y="158" width="18" height="372" fill="#527c8a" opacity="0.8"/>
    <rect x="433" y="58" width="122" height="372" rx="12" fill="#b9c2cb" stroke="#eef0f0" stroke-width="3"/>
    <rect x="433" y="58" width="122" height="41" rx="11" fill="#1b2631"/>
    <line x1="390" x2="602" y1="158" y2="158" stroke="#e4d8aa" stroke-width="4"/>
    <path d="M617 158h22m-11 0v-100m-11 0h22" fill="none" stroke="#e6aa72" stroke-width="3"/>
    <text x="648" y="113" fill="#e6aa72" font-size="17">50mm lift</text>
    <text x="448" y="296" fill="#182638" font-size="17" font-weight="700">core 186mm</text>
    <text x="448" y="487" fill="#d7e5e9" font-size="16">sleeve ≥186mm</text>

    <line x1="724" x2="724" y1="130" y2="530" stroke="#69d3bd" stroke-width="4"/>
    <path d="M715 130h18M715 530h18" stroke="#69d3bd" stroke-width="4"/>
    <text x="746" y="310" fill="#69d3bd" font-size="22" font-weight="700">上限 200mm</text>
    <line x1="724" x2="724" y1="58" y2="130" stroke="#ef8b78" stroke-width="4"/>
    <path d="M715 58h18" stroke="#ef8b78" stroke-width="4"/>
    <text x="746" y="96" fill="#ef8b78" font-size="22" font-weight="700">36mm 超過</text>
    <text x="746" y="370" fill="#f7f7f1" font-size="18">実際の下限 ≥236mm</text>
  </g>
  </g>
  <text x="42" y="710" fill="#9fb5c7" font-family="sans-serif" font-size="15">凡例: 2px = 1mm。固定sleeveを製品の高さから除く解釈は採用していない。</text>
</svg>
