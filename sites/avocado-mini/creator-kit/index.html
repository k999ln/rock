<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catch the Light — browser game starter</title><style>
  *{box-sizing:border-box}body{margin:0;background:#13251c;color:#f6f8f2;font:16px system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:36px 20px}h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.06em}p{line-height:1.55;color:#c7d8cd}button{font:inherit;cursor:pointer}.bar{display:flex;align-items:center;justify-content:space-between;gap:15px}.start{padding:12px 18px;border:0;border-radius:999px;background:#d1f0d4;color:#14301c;font-weight:700}.arena{position:relative;height:min(60vh,480px);margin-top:20px;border:1px solid #9db7a1;border-radius:20px;background:radial-gradient(circle at 50% 20%,#2c4738,#16271e);overflow:hidden}.target{position:absolute;width:66px;height:66px;border:2px solid white;border-radius:50%;background:var(--accent,#9ed8aa);box-shadow:0 0 30px var(--accent,#9ed8aa)}.target[hidden]{display:none}.message[hidden]{display:none}.message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:20px}
</style></head>
<body><main><p>BROWSER GAME STARTER</p><h1 id="title">Catch the Light</h1><p>Tap the light. Try to score before time runs out. This sample has no device or payment permissions.</p><div class="bar"><button id="start" class="start">Start game</button><span>Score <strong id="score">0</strong> · <strong id="time">30</strong>s</span></div><div id="arena" class="arena"><button id="target" class="target" aria-label="Catch the light" hidden></button><div id="message" class="message">Start a round to play.</div></div><p>Edit the manifest and code to make your own browser game.</p></main><script type="module" src="./game.js"></script></body>
</html>
