[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackberryrock"
version = "0.3.0"
description = "Rock star os development Hub, text recipe runtime and Wallet simulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
blackberryrock = "blackberryrock.cli:main"
rock-hub = "blackberryrock.hub_server:main"
rock-sdk = "blackberryrock.sdk:main"

[tool.setuptools.package-data]
blackberryrock = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
